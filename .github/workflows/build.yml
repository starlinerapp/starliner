name: Build Images

on:
  workflow_dispatch:
    inputs:
      infrastructure_branch:
        description: "Infrastructure branch to deploy"
        required: true
        default: main
        type: string
  push:
    branches:
      - main

env:
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && 'develop' || 'latest' }}
  ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && 'staging' || 'production' }}
  INFRASTRUCTURE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.infrastructure_branch || 'main' }}
jobs:
  build-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push auth image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/auth/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/auth:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/auth:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/auth:cache,mode=max

  build-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/client/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/client:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/client:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/client:cache,mode=max

  build-server-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/server/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/server-api:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/server-api:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/server-api:cache,mode=max

  build-server-builder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server-builder image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/server/builder/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/server-builder:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/server-builder:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/server-builder:cache,mode=max

  build-server-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server-cluster image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/server/cluster/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/server-cluster:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/server-cluster:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/server-cluster:cache,mode=max

  build-server-provisioner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server-provisioner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/server/provisioner/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/server-provisioner:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/server-provisioner:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/server-provisioner:cache,mode=max

  trigger-deployment:
    needs:
      - build-auth
      - build-client
      - build-server-api
      - build-server-builder
      - build-server-cluster
      - build-server-provisioner
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_PAT }}
          repository: 'starlinerapp/infrastructure'
          event-type: deploy_new_images
          client-payload: '{"environment": "${{ env.ENVIRONMENT }}", "infrastructure_branch": "${{ env.INFRASTRUCTURE_BRANCH }}"}'
