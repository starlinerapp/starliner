syntax = "proto3";

package proto.v1;

option go_package = "starliner.app/internal/core/infrastructure/grpc/proto/v1";

import "google/protobuf/duration.proto";

service RunnerHeartbeatService {
  rpc StreamHeartbeats(stream HeartbeatMessage) returns (stream HeartbeatAckMessage);
}

service RunnerJobService {
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobResponse);
  rpc ReportBuildLog(ReportBuildLogRequest) returns (ReportBuildLogResponse);
  rpc ReportBuildResult(ReportBuildResultRequest) returns (ReportBuildResultResponse);
}

enum BuildStatus {
  BUILD_STATUS_UNSPECIFIED = 0;
  BUILD_STATUS_SUCCESS = 1;
  BUILD_STATUS_FAILED = 2;
}

message BuildArg {
  string name = 1;
  string value = 2;
}

message BuildJob {
  int64 build_id = 1;
  int64 deployment_id = 2;
  string image_name = 3;
  string image_registry_url = 4;
  string git_url = 5;
  string branch_name = 6;
  string access_token = 7;
  string registry_push_token = 8;
  string root_directory = 9;
  string dockerfile_path = 10;
  repeated BuildArg args = 11;
}

message BuildLogChunk {
  int64 build_id = 1;
  bytes data = 2;
}

message BuildResult {
  int64 build_id = 1;
  int64 deployment_id = 2;
  string commit_hash = 3;
  string tag = 4;
  string image_name = 5;
  string logs = 6;
  BuildStatus status = 7;
}

message ClaimJobRequest {}

message ClaimJobResponse {
  BuildJob job = 1;
}

message ReportBuildLogRequest {
  int64 build_id = 1;
  bytes data = 2;
}

message ReportBuildLogResponse {}

message ReportBuildResultRequest {
  BuildResult result = 1;
}

message ReportBuildResultResponse {}

message HeartbeatMessage {
  oneof payload {
    RunnerHeartbeat heartbeat = 1;
  }
}

message HeartbeatAckMessage {
  oneof payload {
    HeartbeatAck heartbeat_ack = 1;
  }
}

message RunnerHeartbeat {
  uint64 sequence = 1;
  int32 max_concurrent_jobs = 2;
  int32 active_jobs = 3;
}

message HeartbeatAck {
  uint64 sequence = 1;
  google.protobuf.Duration lease_ttl = 2;
}
